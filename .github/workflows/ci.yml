name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    name: Build (tsc) + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test

  pre-merge-check:
    name: Pre-merge git-tasks check (PR gate)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile

      # Report-only: annotation drift is never a reason to block a PR. It is
      # recorded on the entries as a `drift` mark and surfaced in the sticky
      # comment and step summary below. (`--fail-on` exists for teams that want
      # the old gate; we deliberately do not pass it.)
      - name: Reconcile sanity — report drift
        run: node out/cli/index.js check

      - name: Block PRs that introduce open critical issues on changed files
        run: |
          node out/cli/index.js check \
            --fail-on-open-severity critical \
            --base origin/${{ github.base_ref }}

      # Emit GitHub Checks API annotations so every git-tasks entry on the
      # changed files appears as an inline warning/error directly in the
      # PR's Files Changed tab.
      - name: Inline annotations on diff
        if: always()
        run: node out/cli/index.js diff --base origin/${{ github.base_ref }} --github-annotations

      - name: Step summary
        if: always()
        run: |
          {
            echo "## git-tasks pre-merge report"
            echo ""
            echo "### Annotations on files changed in this PR"
            echo ""
            node out/cli/index.js diff --base origin/${{ github.base_ref }} || true
            echo ""
            echo "### Reconcile / check"
            echo ""
            echo '```json'
            node out/cli/index.js check --format json --base origin/${{ github.base_ref }} || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          MARKER="<!-- git-tasks-pr-report -->"

          # Build the comment body.
          BODY_FILE=$(mktemp)
          {
            echo "$MARKER"
            echo "## :clipboard: git-tasks report"
            echo ""
            BODY=$(node out/cli/index.js diff --base origin/$BASE_REF)
            if [ -n "$BODY" ]; then
              echo "$BODY"
            else
              echo "_No annotations on files changed in this PR._"
            fi
            echo ""
            echo "<details><summary>Reconcile / check (JSON)</summary>"
            echo ""
            echo '```json'
            node out/cli/index.js check --format json --base origin/$BASE_REF
            echo '```'
            echo "</details>"
            echo ""
            echo "_Updated by the git-tasks CI job._"
          } > "$BODY_FILE"

          # Find an existing sticky comment to update; otherwise post new.
          EXISTING_ID=$(gh api "/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty")

          if [ -n "$EXISTING_ID" ]; then
            gh api -X PATCH "/repos/${{ github.repository }}/issues/comments/$EXISTING_ID" \
              -f body="$(cat "$BODY_FILE")" > /dev/null
            echo "Updated existing sticky comment."
          else
            gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE" > /dev/null
            echo "Posted new sticky comment."
          fi

  post-merge-audit:
    name: Post-merge audit on main
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile

      # Reconcile in-place and push the result back. Annotations are metadata
      # about the code, not a property of it: if they drifted on main, the fix
      # is to settle them, not to redden the build for everyone downstream.
      # Drift that cannot be auto-relocated is recorded as a `drift` mark on the
      # entry by this same run, so it stays visible without blocking anything.
      - name: Reconcile on main
        run: node out/cli/index.js reconcile

      - name: Commit reconciled annotations back to main
        run: |
          if git diff --quiet -- .git-tasks 2>/dev/null; then
            echo "Annotations already settled on main."
            exit 0
          fi
          echo "::notice::Reconcile settled annotations on main; committing the result."
          git --no-pager diff -- .git-tasks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .git-tasks
          git commit -m "chore(git-tasks): reconcile annotations on main [skip ci]"
          # Another push may have landed while we were building. Rebasing and
          # retrying is best-effort: failing to record reconciled metadata is
          # not a reason to fail the job, and the next push re-runs this.
          git pull --rebase --autostash origin main || true
          git push || echo "::warning::Could not push reconciled annotations; the next run will retry."

      # Report only — never changes the job's outcome.
      - name: Drift report
        if: always()
        run: |
          {
            echo "## git-tasks post-merge audit"
            echo ""
            echo '```'
            node out/cli/index.js check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
